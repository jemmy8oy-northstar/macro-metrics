name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── .NET backend unit & integration tests ─────────────────────────────────
  backend-tests:
    name: Backend Tests (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/MacroMetrics.slnx

      - name: Build
        run: dotnet build backend/MacroMetrics.slnx --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test backend/MacroMetrics.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/*.trx

  # ── Python yfinance sidecar unit & integration tests ──────────────────────
  sidecar-tests:
    name: Sidecar Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sidecar/requirements-dev.txt

      - name: Install dependencies
        working-directory: sidecar
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        working-directory: sidecar
        run: pytest tests/test_unit.py -v --tb=short

      - name: Run integration tests
        working-directory: sidecar
        run: pytest tests/test_integration.py -v --tb=short

  # ── End-to-end: backend + sidecar wired together via Docker Compose ────────
  e2e-tests:
    name: E2E Tests (backend ↔ sidecar)
    runs-on: ubuntu-latest
    # Only run E2E on PRs targeting main and on direct pushes to main to keep
    # feature-branch CI fast.  Remove this condition to run on every push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & start services
        run: docker compose -f docker-compose.e2e.yml up --build -d

      - name: Wait for sidecar to be healthy
        run: |
          echo "Waiting for yfinance sidecar..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "Sidecar is healthy"
              break
            fi
            echo "  attempt $i/30 — retrying in 3 s..."
            sleep 3
          done
          curl -sf http://localhost:8001/health || (echo "Sidecar failed to become healthy" && exit 1)

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/api/metrics > /dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            echo "  attempt $i/40 — retrying in 5 s..."
            sleep 5
          done
          curl -sf http://localhost:8080/api/metrics || (echo "Backend failed to become healthy" && exit 1)

      - name: E2E — sidecar health endpoint
        run: |
          response=$(curl -sf http://localhost:8001/health)
          echo "Sidecar health: $response"
          echo "$response" | grep -q '"ok"' || (echo "Unexpected sidecar health response" && exit 1)

      - name: E2E — backend metric catalogue
        run: |
          response=$(curl -sf http://localhost:8080/api/metrics)
          echo "Backend metrics response (truncated):"
          echo "$response" | head -c 500
          echo "$response" | grep -qi "gold" || (echo "Expected 'gold' in metric catalogue" && exit 1)

      - name: E2E — backend can reach sidecar (via /api/metrics/{id} series call)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/metrics/gold)
          echo "GET /api/metrics/gold → HTTP $status"
          [[ "$status" == "200" || "$status" == "502" || "$status" == "404" ]] \
            || (echo "Unexpected status $status — backend/sidecar wiring is broken" && exit 1)

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v