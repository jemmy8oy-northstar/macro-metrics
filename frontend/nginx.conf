server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /macro-metrics {
        return 301 /macro-metrics/;
    }

    location /macro-metrics/ {
        try_files $uri /macro-metrics/index.html;
    }

    # Optional: cache static files aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
