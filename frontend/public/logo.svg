  />
  <!-- Dots on the line -->
  <circle cx="4"  cy="24" r="1.5" fill="#4ade80"/>
  <circle cx="10" cy="18" r="1.5" fill="#4ade80"/>
  <circle cx="16" cy="20" r="1.5" fill="#4ade80"/>
  <circle cx="22" cy="10" r="1.5" fill="#4ade80"/>
  <circle cx="28" cy="6"  r="1.5" fill="#4ade80"/>
</svg>
